name: Build and Deploy to Cloud Run

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  REGION: asia-northeast3
  REPO: chatbot-repo
  SERVICE: chatbot-api
  DB_INSTANCE: chatbot-db
  MODEL: minimax/minimax-m3:free

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker 빌드 테스트 (배포 없이 빌드만 검증)
        run: docker build -t test-image .

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker 인증
        run: gcloud auth configure-docker $REGION-docker.pkg.dev --quiet

      - name: 빌드 & 푸시
        run: |
          IMAGE=$REGION-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/$REPO/$SERVICE:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      - name: Cloud Run 배포
        run: |
          INSTANCE_CONN="${{ secrets.GCP_PROJECT_ID }}:$REGION:$DB_INSTANCE"
          gcloud run deploy $SERVICE \
            --image=$IMAGE \
            --region=$REGION \
            --platform=managed \
            --port=8000 \
            --allow-unauthenticated \
            --add-cloudsql-instances=$INSTANCE_CONN \
            --set-secrets="OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENROUTER_API_KEY=OPENROUTER_API_KEY:latest" \
            --set-env-vars="DB_HOST=/cloudsql/$INSTANCE_CONN,DB_NAME=chatbot_db,DB_USER=chatbot_user,DB_PASSWORD=StrongPassword123!,MODEL=$MODEL" \
            --quiet
